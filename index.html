<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>אפליקציית חיטוב חכמה</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --bg: #f4f6f8;
    --card: #ffffff;
    --ink: #222;
    --muted: #777;
    --brand: #2c7be5;
    --good: #1e9e62;
    --bad: #d64545;
    --warn: #e0a800;
    --line: #e3e6ea;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    direction: rtl;
    background: var(--bg);
    color: var(--ink);
    margin: 0;
    padding: 0;
    line-height: 1.5;
  }
  .layout {
    display: grid;
    grid-template-columns: 300px 1fr;
    gap: 20px;
    max-width: 1100px;
    margin: 0 auto;
    padding: 16px;
    align-items: start;
  }
  h1 { font-size: 22px; margin: 4px 0 12px; }
  h2 {
    background: #222;
    color: #fff;
    padding: 8px 12px;
    border-radius: 10px;
    font-size: 16px;
    margin: 0 0 10px;
  }
  h3 { margin: 0 0 8px; }
  h4 { margin: 14px 0 6px; }
  .section {
    background: var(--card);
    padding: 12px;
    margin-bottom: 14px;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  button {
    cursor: pointer;
    font-size: 14px;
    padding: 9px 12px;
    border-radius: 9px;
    border: 1px solid var(--line);
    background: #fafbfc;
    transition: background .15s, transform .05s;
  }
  button:hover { background: #eef1f5; }
  button:active { transform: scale(.97); }
  .food-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 8px;
  }
  .food-grid button { text-align: right; }
  .food-grid button small { display: block; color: var(--muted); font-size: 11px; }

  /* Summary panel */
  #summary {
    position: sticky;
    top: 16px;
    background: var(--card);
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .stat { margin: 10px 0; }
  .stat .nums { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 4px; }
  .stat .nums b { font-size: 15px; }
  .bar { background: #eef1f5; border-radius: 99px; height: 10px; overflow: hidden; }
  .bar > span { display: block; height: 100%; border-radius: 99px; transition: width .3s; }
  .good { color: var(--good); }
  .bad  { color: var(--bad); }
  .warn { color: var(--warn); }
  #suggest > div { padding: 6px 8px; border-radius: 8px; margin: 5px 0; font-size: 13px; background: #f7f9fb; }
  #suggest .good { background: #e8f6ee; }
  #suggest .bad  { background: #fbeaea; }
  #suggest .warn { background: #fcf6e3; }

  .controls { display: flex; gap: 8px; margin-top: 12px; }
  .controls button { flex: 1; }
  .controls .primary { background: var(--brand); color: #fff; border-color: var(--brand); }
  .controls .primary:hover { background: #1f6fd6; }

  /* Food log */
  #log { list-style: none; padding: 0; margin: 0; }
  #log li {
    display: flex; align-items: center; justify-content: space-between;
    padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  #log li:last-child { border-bottom: none; }
  #log .meta { color: var(--muted); font-size: 12px; }
  #log .del {
    border: none; background: none; color: var(--bad);
    font-size: 18px; line-height: 1; padding: 0 6px;
  }
  .empty { color: var(--muted); font-size: 13px; padding: 6px 0; }

  /* Custom + targets rows */
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .row input {
    flex: 1; min-width: 70px; padding: 8px; border: 1px solid var(--line);
    border-radius: 8px; font-size: 14px; text-align: right;
  }
  .row label { font-size: 13px; color: var(--muted); }

  canvas { max-width: 100%; }

  @media (max-width: 760px) {
    .layout { grid-template-columns: 1fr; }
    #summary { position: static; order: -1; }
  }
</style>
</head>
<body>

<div class="layout">

  <!-- ===== Summary panel ===== -->
  <aside id="summary">
    <h3>סיכום יום</h3>
    <div class="meta" id="today-date"></div>

    <div class="stat">
      <div class="nums"><span>קלוריות</span><b><span id="cal">0</span> / <span id="cal-target">2200</span></b></div>
      <div class="bar"><span id="cal-bar" style="width:0%;background:var(--brand)"></span></div>
    </div>

    <div class="stat">
      <div class="nums"><span>חלבון (גרם)</span><b><span id="prot">0</span> / <span id="prot-target">160</span></b></div>
      <div class="bar"><span id="prot-bar" style="width:0%;background:var(--good)"></span></div>
    </div>

    <h4>הצעות חכמות</h4>
    <div id="suggest"></div>

    <div class="controls">
      <button class="primary" onclick="saveWeight()">שמור משקל</button>
      <button onclick="resetDay()">יום חדש</button>
    </div>
  </aside>

  <!-- ===== Main content ===== -->
  <main>
    <h1>אפליקציית חיטוב חכמה 💪</h1>

    <h2>בוקר</h2>
    <div class="section food-grid" data-meal="בוקר">
      <button onclick="add('חביתה 4 ביצים',280,28)">חביתה 4 ביצים<small>280 קק״ל · 28ג׳ חלבון</small></button>
      <button onclick="add('קוטג׳ 250g',300,30)">קוטג׳ 250g<small>300 קק״ל · 30ג׳ חלבון</small></button>
      <button onclick="add('שייק חלבון',130,25)">שייק חלבון<small>130 קק״ל · 25ג׳ חלבון</small></button>
      <button onclick="add('לחם 2 פרוסות',160,4)">לחם 2 פרוסות<small>160 קק״ל · 4ג׳ חלבון</small></button>
    </div>

    <h2>צהריים</h2>
    <div class="section food-grid" data-meal="צהריים">
      <button onclick="add('חזה עוף 250g',330,70)">חזה עוף 250g<small>330 קק״ל · 70ג׳ חלבון</small></button>
      <button onclick="add('המבורגר 2 קציצות',450,50)">המבורגר 2 קציצות<small>450 קק״ל · 50ג׳ חלבון</small></button>
      <button onclick="add('סטייק 250g',400,55)">סטייק 250g<small>400 קק״ל · 55ג׳ חלבון</small></button>
      <button onclick="add('פיתה',200,5)">פיתה<small>200 קק״ל · 5ג׳ חלבון</small></button>
      <button onclick="add('אורז 200g',260,5)">אורז 200g<small>260 קק״ל · 5ג׳ חלבון</small></button>
      <button onclick="add('טונה בקופסה',180,30)">טונה בקופסה<small>180 קק״ל · 30ג׳ חלבון</small></button>
    </div>

    <h2>נשנושים</h2>
    <div class="section food-grid" data-meal="נשנושים">
      <button onclick="add('שוקולד',100,1)">שוקולד<small>100 קק״ל · 1ג׳ חלבון</small></button>
      <button onclick="add('ארטיק',120,2)">ארטיק<small>120 קק״ל · 2ג׳ חלבון</small></button>
      <button onclick="add('יוגורט יווני',90,15)">יוגורט יווני<small>90 קק״ל · 15ג׳ חלבון</small></button>
      <button onclick="add('אגוזים חופן',180,6)">אגוזים חופן<small>180 קק״ל · 6ג׳ חלבון</small></button>
    </div>

    <h2>הוספה ידנית</h2>
    <div class="section">
      <div class="row">
        <input id="c-name" type="text" placeholder="שם מאכל">
        <input id="c-cal" type="number" inputmode="numeric" placeholder="קלוריות">
        <input id="c-prot" type="number" inputmode="numeric" placeholder="חלבון (ג׳)">
        <button class="primary" onclick="addCustom()" style="color:#fff;background:var(--brand);border-color:var(--brand)">הוסף</button>
      </div>
    </div>

    <h2>מה אכלתי היום</h2>
    <div class="section">
      <ul id="log"></ul>
    </div>

    <h2>יעדים יומיים</h2>
    <div class="section">
      <div class="row">
        <label>יעד קלוריות</label>
        <input id="t-cal" type="number" inputmode="numeric">
        <label>יעד חלבון (ג׳)</label>
        <input id="t-prot" type="number" inputmode="numeric">
        <button onclick="saveTargets()">עדכן יעדים</button>
      </div>
    </div>

    <h2>גרף ירידה במשקל</h2>
    <div class="section">
      <canvas id="chart" height="120"></canvas>
      <p id="weight-empty" class="empty">עדיין לא נשמרו משקלים — לחץ על "שמור משקל".</p>
      <button id="undo-weight" onclick="removeLastWeight()" style="margin-top:8px;display:none">מחק משקל אחרון</button>
    </div>
  </main>
</div>

<script>
// ===== State & persistence =====
const todayKey = () => new Date().toLocaleDateString('he-IL');

let targets = JSON.parse(localStorage.getItem("targets") || 'null') || { cal: 2200, prot: 160 };
let weights = JSON.parse(localStorage.getItem("weights") || "[]");

// Daily log is stored per-date so a reload keeps today's food and a new day starts fresh.
let dayStore = JSON.parse(localStorage.getItem("day") || 'null');
if (!dayStore || dayStore.date !== todayKey()) {
  dayStore = { date: todayKey(), items: [] };
}

function persistDay()     { localStorage.setItem("day", JSON.stringify(dayStore)); }
function persistTargets()  { localStorage.setItem("targets", JSON.stringify(targets)); }
function persistWeights()  { localStorage.setItem("weights", JSON.stringify(weights)); }

// ===== Food logging =====
function add(name, c, p) {
  dayStore.items.push({ name, c: Number(c), p: Number(p) });
  persistDay();
  update();
}

function addCustom() {
  const name = document.getElementById("c-name").value.trim();
  const c = Number(document.getElementById("c-cal").value);
  const p = Number(document.getElementById("c-prot").value);
  if (!name || (!c && !p)) { alert("הכנס שם וכמות קלוריות/חלבון"); return; }
  add(name, c || 0, p || 0);
  document.getElementById("c-name").value = "";
  document.getElementById("c-cal").value = "";
  document.getElementById("c-prot").value = "";
}

function removeItem(i) {
  dayStore.items.splice(i, 1);
  persistDay();
  update();
}

function totals() {
  return dayStore.items.reduce(
    (t, it) => ({ cal: t.cal + it.c, prot: t.prot + it.p }),
    { cal: 0, prot: 0 }
  );
}

// ===== Rendering =====
function update() {
  const { cal, prot } = totals();

  document.getElementById("today-date").innerText = "תאריך: " + dayStore.date;
  document.getElementById("cal").innerText = cal;
  document.getElementById("prot").innerText = prot;
  document.getElementById("cal-target").innerText = targets.cal;
  document.getElementById("prot-target").innerText = targets.prot;

  setBar("cal-bar", cal, targets.cal);
  setBar("prot-bar", prot, targets.prot);

  renderLog();
  suggest(cal, prot);
}

function setBar(id, value, target) {
  const pct = target > 0 ? Math.min(100, Math.round((value / target) * 100)) : 0;
  const bar = document.getElementById(id);
  bar.style.width = pct + "%";
  // Turn red once you pass the target by more than 10%.
  bar.style.background = value > target * 1.1 ? "var(--bad)" : bar.dataset.color || bar.style.background;
}

function renderLog() {
  const ul = document.getElementById("log");
  ul.innerHTML = "";
  if (dayStore.items.length === 0) {
    ul.innerHTML = '<li class="empty">עדיין לא הוספת מאכלים היום.</li>';
    return;
  }
  dayStore.items.forEach((it, i) => {
    const li = document.createElement("li");
    li.innerHTML =
      `<span>${escapeHtml(it.name)} <span class="meta">${it.c} קק״ל · ${it.p}ג׳</span></span>` +
      `<button class="del" title="הסר" onclick="removeItem(${i})">×</button>`;
    ul.appendChild(li);
  });
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function suggest(cal, prot) {
  let html = "";
  const proteinGap = targets.prot - prot;
  const calGap = targets.cal - cal;

  if (proteinGap > 30) {
    html += `<div class='bad'>חסר חלבון (עוד ${proteinGap}ג׳) — מומלץ שייק או חזה עוף</div>`;
  } else if (proteinGap > 0) {
    html += `<div class='warn'>כמעט שם — עוד ${proteinGap}ג׳ חלבון ליעד</div>`;
  } else {
    html += `<div class='good'>יעד החלבון הושג ✅</div>`;
  }

  if (calGap < -200) {
    html += `<div class='bad'>עודף קלוריות (${-calGap} מעל היעד) — להוריד נשנושים</div>`;
  } else if (calGap > 300) {
    html += `<div class='good'>נשאר מקום ל-${calGap} קק״ל — אפשר להוסיף אוכל נקי</div>`;
  } else {
    html += `<div class='good'>מאזן קלוריות תקין להיום</div>`;
  }

  document.getElementById("suggest").innerHTML = html;
}

// ===== Day reset =====
function resetDay() {
  if (dayStore.items.length && !confirm("לאפס את היום ולמחוק את כל המאכלים?")) return;
  dayStore = { date: todayKey(), items: [] };
  persistDay();
  update();
}

// ===== Targets =====
function saveTargets() {
  const c = Number(document.getElementById("t-cal").value);
  const p = Number(document.getElementById("t-prot").value);
  if (c > 0) targets.cal = c;
  if (p > 0) targets.prot = p;
  persistTargets();
  update();
}

// ===== Weight tracking =====
function saveWeight() {
  const w = prompt("כמה הוא שוקל היום? (ק״ג)");
  if (!w) return;
  const num = Number(w);
  if (!num || num <= 0) { alert("הכנס מספר תקין"); return; }
  weights.push({ date: todayKey(), weight: num });
  persistWeights();
  drawChart();
}

function removeLastWeight() {
  if (!weights.length) return;
  if (!confirm("למחוק את רישום המשקל האחרון?")) return;
  weights.pop();
  persistWeights();
  drawChart();
}

let chart = null;
function drawChart() {
  const empty = document.getElementById("weight-empty");
  const undoBtn = document.getElementById("undo-weight");
  empty.style.display = weights.length ? "none" : "block";
  undoBtn.style.display = weights.length ? "inline-block" : "none";

  const ctx = document.getElementById("chart");
  const labels = weights.map(w => w.date);
  const data = weights.map(w => w.weight);

  // Reuse a single Chart instance — recreating without destroying leaks and
  // causes flicker/ghost tooltips. Update in place when it already exists.
  if (chart) {
    chart.data.labels = labels;
    chart.data.datasets[0].data = data;
    chart.update();
    return;
  }

  chart = new Chart(ctx, {
    type: "line",
    data: {
      labels,
      datasets: [{
        label: "משקל (ק״ג)",
        data,
        borderColor: "#2c7be5",
        backgroundColor: "rgba(44,123,229,.12)",
        fill: true,
        tension: .25,
        pointRadius: 4
      }]
    },
    options: {
      responsive: true,
      plugins: { legend: { labels: { font: { family: "Arial" } } } },
      scales: { y: { beginAtZero: false } }
    }
  });
}

// ===== Init =====
document.querySelectorAll(".bar > span").forEach(s => { s.dataset.color = s.style.background; });
document.getElementById("t-cal").value = targets.cal;
document.getElementById("t-prot").value = targets.prot;
drawChart();
update();
</script>

</body>
</html>
